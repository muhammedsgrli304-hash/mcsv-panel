<!DOCTYPE html>
<html>
  <head>
    <title>MCSV Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>⛏️ MCSV</h2>
      <div id="userInfo"></div>
      <hr />
      <button onclick="showTab('console')">📟 Консоль</button>
      <button onclick="showTab('files')">📁 Файлы</button>
      <button onclick="showTab('plugins')">🧩 Плагины</button>
      <button onclick="showTab('settings')">⚙️ Настройки</button>
      <div id="adminBtn" style="display: none">
        <button onclick="window.location='/admin'" style="background: #7c3aed">
          👑 Админ
        </button>
      </div>
      <button onclick="logout()" style="background: #dc2626; margin-top: 20px">
        🚪 Выйти
      </button>
    </div>

    <div class="main">
      <!-- Консоль -->
      <div id="consoleTab" class="tab active">
        <h1>📟 Консоль</h1>
        <div class="status-bar">
          <span id="status">🔴 Остановлен</span>
          <span id="portInfo"></span>
        </div>
        <div style="display: flex; gap: 10px; margin: 15px 0">
          <button class="glow" onclick="createServer()" id="createBtn">
            ➕ Создать сервер
          </button>
          <button class="glow" onclick="startServer()">▶️ Запустить</button>
          <button class="glow red" onclick="stopServer()">⏹️ Остановить</button>
          <button class="glow" onclick="restartServer()">
            🔄 Перезапустить
          </button>
        </div>
        <div class="console" id="console"></div>
        <div class="command-box">
          <input
            type="text"
            id="commandInput"
            placeholder="Введите команду..."
          />
          <button onclick="sendCommand()">Отправить</button>
        </div>
      </div>

      <!-- Файлы -->
      <div id="filesTab" class="tab">
        <h1>📁 Файлы</h1>
        <div class="file-manager">
          <div class="file-list">
            <h3>Файлы</h3>
            <ul id="fileList"></ul>
          </div>
          <div class="file-editor">
            <div class="editor-header">
              <h3 id="currentFileName">Выберите файл</h3>
              <button
                onclick="saveFile()"
                class="glow"
                id="saveBtn"
                style="display: none"
              >
                💾 Сохранить
              </button>
            </div>
            <textarea id="fileContent" class="file-content" readonly></textarea>
          </div>
        </div>
        <div class="upload-section">
          <h3>Загрузить ZIP</h3>
          <form id="uploadForm">
            <input type="file" name="file" accept=".zip" />
            <button class="glow">📤 Загрузить</button>
          </form>
        </div>
      </div>

      <!-- Плагины -->
      <div id="pluginsTab" class="tab">
        <h1>🧩 Поиск плагинов</h1>
        <div class="search-box">
          <input
            type="text"
            id="pluginSearch"
            placeholder="Название плагина (минимум 3 символа)..."
            oninput="searchPlugins()"
          />
          <button class="glow" onclick="searchPlugins()">🔍 Найти</button>
        </div>
        <div id="pluginResults" style="margin-top: 20px">
          <p style="color: #6b7280">Введите название плагина для поиска</p>
        </div>
      </div>

      <!-- Настройки -->
      <div id="settingsTab" class="tab">
        <h1>⚙️ Настройки сервера</h1>
        <div class="settings-group">
          <h3>📥 Скачать ядро Paper</h3>
          <div style="display: flex; gap: 10px; align-items: center">
            <select
              id="versionSelect"
              style="
                background: #0f1322;
                color: white;
                padding: 10px 15px;
                border-radius: 8px;
                border: 1px solid #2d325a;
                min-width: 200px;
              "
            >
              <option>⏳ Загрузка версий...</option>
            </select>
            <button class="glow" onclick="downloadPaper()">📥 Скачать</button>
          </div>
          <div id="coreMessage" class="info-message">
            Выберите версию и нажмите "Скачать"
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
